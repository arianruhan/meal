name: Update meal chart data

on:
  schedule:
    - cron: "*/30 * * * *" 
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install openpyxl requests

      - name: Fetch latest workbook from OneDrive
        env:
          ONEDRIVE_SHARE_URL: ${{ secrets.ONEDRIVE_SHARE_URL }}
        run: python scripts/build_data.py

      - name: Commit updated data.json
        run: |
          git config user.name "meal-chart-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data.json; then
            echo "No changes to data.json"
          else
            git add data.json
            git commit -m "Auto-update meal chart data [skip ci]"
            # Fetch remote and rebase our commit on top of origin/main to avoid non-fast-forward errors
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
