<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1024"> <!-- Forces desktop width -->
<title>BAHRAM UNCLE MESS — Meal Chart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-page: #F4F7FB;
    
    --card-bg: rgba(255, 255, 255, 0.92);
    --card-border: rgba(226, 232, 240, 0.8);
    --inner-bg: #F8FAFC;
    
    --text-main: #0F172A;
    --text-muted: #475569;
    --text-dim: #64748B;
    
    --navy: #0F172A;
    --navy-light: #1E293B;
    
    --credit: #059669;
    --credit-bg: #ECFDF5;
    --credit-border: #A7F3D0;
    
    --due: #E11D48;
    --due-bg: #FFF1F2;
    --due-border: #FECDD3;
    
    --gold: #D97706;
    --teal: #0D9488;
    --purple: #7C3AED;
    --sky: #0284C7;
    --indigo: #4F46E5;
    
    --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    --shadow-md: 0 12px 28px -4px rgba(15, 23, 42, 0.08), 0 4px 12px -2px rgba(15, 23, 42, 0.04);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  
  body {
    background-color: var(--bg-page);
    /* Colorful University/Modern Office Vibrant Mesh Gradient Background */
    background-image: 
      radial-gradient(at 10% 10%, rgba(99, 102, 241, 0.18) 0px, transparent 40%),
      radial-gradient(at 90% 15%, rgba(14, 165, 233, 0.18) 0px, transparent 45%),
      radial-gradient(at 50% 50%, rgba(236, 72, 153, 0.12) 0px, transparent 50%),
      radial-gradient(at 80% 85%, rgba(16, 185, 129, 0.15) 0px, transparent 45%),
      radial-gradient(at 15% 90%, rgba(245, 158, 11, 0.15) 0px, transparent 45%);
    background-attachment: fixed;
    color: var(--text-main);
    font-family: 'Plus Jakarta Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  a { color: var(--indigo); text-decoration: none; font-weight: 500; }
  a:hover { text-decoration: underline; }
  
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px 80px; }

  /* Colorful Executive Header */
  header.top {
    background: linear-gradient(135deg, #0F172A 0%, #1E1B4B 40%, #1E293B 100%);
    color: #FFFFFF;
    padding: 42px 20px 34px;
    position: relative;
    box-shadow: 0 10px 30px -10px rgba(15, 23, 42, 0.3);
  }
  
  header.top::after {
    content: "";
    display: block;
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 4px;
    background: linear-gradient(90deg, #F59E0B, #10B981, #06B6D4, #6366F1, #EC4899);
  }

  header.top .inner {
    max-width: 1080px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 16px;
  }

  .brand-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: #38BDF8;
    margin: 0 0 6px;
    font-weight: 700;
  }

  h1 {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 800;
    font-size: clamp(28px, 4.5vw, 42px);
    margin: 0;
    letter-spacing: -0.03em;
    color: #FFFFFF;
  }

  .status {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: #94A3B8;
    text-align: right;
    line-height: 1.7;
  }

  .status .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #10B981;
    margin-right: 6px;
    box-shadow: 0 0 10px #10B981;
  }

  .status button {
    margin-top: 6px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #F8FAFC;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    letter-spacing: .05em;
    transition: all 0.2s ease;
    backdrop-filter: blur(4px);
  }

  .status button:hover {
    background: rgba(255, 255, 255, 0.2);
    border-color: #38BDF8;
    color: #38BDF8;
  }

  .status button:focus-visible, a:focus-visible, .row-toggle:focus-visible {
    outline: 2px solid #38BDF8;
    outline-offset: 2px;
  }

  /* Vibrant Stat cards */
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 16px;
    margin: 32px 0 40px;
  }

  .stat {
    padding: 20px;
    position: relative;
    background: var(--card-bg);
    backdrop-filter: blur(12px);
    border: 1px solid var(--card-border);
    border-top: 4px solid var(--accent, var(--indigo));
    border-radius: 12px;
    box-shadow: var(--shadow-md);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .stat:hover {
    transform: translateY(-3px);
    box-shadow: 0 16px 32px -4px rgba(15, 23, 42, 0.12);
  }

  .stat:nth-child(1){ --accent: var(--gold); }
  .stat:nth-child(2){ --accent: var(--teal); }
  .stat:nth-child(3){ --accent: var(--purple); }
  .stat:nth-child(4){ --accent: var(--credit); }
  .stat:nth-child(5){ --accent: var(--due); }
  .stat:nth-child(6){ --accent: var(--sky); }

  .stat .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 8px;
    font-weight: 600;
  }

  .stat .value {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 800;
    font-size: 26px;
    color: var(--navy);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  .stat .value.due { color: var(--due); }
  .stat .value.credit { color: var(--credit); }
  .stat .sub { font-size: 11.5px; color: var(--text-dim); margin-top: 4px; font-weight: 500; }

  /* Content Cards / Containers */
  section {
    margin-bottom: 36px;
    background: var(--card-bg);
    backdrop-filter: blur(12px);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 26px 28px 12px;
    box-shadow: var(--shadow-md);
  }

  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 2px solid #E2E8F0;
    padding-bottom: 14px;
    margin-bottom: 10px;
  }

  .section-head h2 {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 700;
    font-size: 20px;
    margin: 0;
    color: var(--navy);
    letter-spacing: -0.02em;
  }

  .section-head .count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    color: var(--indigo);
    background: #EEF2FF;
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid #C7D2FE;
  }

  /* Ledger Table */
  table.ledger { width: 100%; border-collapse: collapse; font-size: 14px; }
  
  table.ledger thead th {
    text-align: left;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--text-muted);
    padding: 14px 12px;
    border-bottom: 1px solid #E2E8F0;
    font-weight: 700;
  }

  table.ledger th.num, table.ledger td.num { text-align: right; font-variant-numeric: tabular-nums; }
  
  table.ledger tbody tr.row-toggle {
    border-bottom: 1px solid #F1F5F9;
    cursor: pointer;
    transition: background-color 0.15s ease;
  }

  table.ledger tbody tr.row-toggle:hover { background: #F8FAFC; }
  table.ledger td { padding: 15px 12px; vertical-align: middle; }

  .row-name { font-weight: 700; font-size: 15px; color: var(--navy); margin-right: 8px; }
  
  .badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .06em;
    padding: 3px 8px;
    border-radius: 4px;
    display: inline-block;
  }

  .badge.due { background: var(--due-bg); color: var(--due); border: 1px solid var(--due-border); }
  .badge.credit { background: var(--credit-bg); color: var(--credit); border: 1px solid var(--credit-border); }

  td.num { font-family: 'JetBrains Mono', monospace; font-size: 13.5px; font-weight: 500; }
  td.num.due { color: var(--due); font-weight: 700; }
  td.num.credit { color: var(--credit); font-weight: 700; }

  /* Expanded Meal Chips Drawer */
  .day-detail { display: none; background: var(--inner-bg); }
  .day-detail.open { display: table-row; }
  .day-detail td { padding: 18px 20px; border-bottom: 1px solid #E2E8F0; }

  .day-grid { display: flex; flex-wrap: wrap; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 11px; }
  
  .day-chip {
    border: 1px solid #E2E8F0;
    background: #FFFFFF;
    padding: 6px 10px;
    min-width: 54px;
    text-align: center;
    border-radius: 8px;
    box-shadow: var(--shadow-sm);
  }

  .day-chip .d { color: var(--text-dim); display: block; font-size: 9px; margin-bottom: 2px; }
  .day-chip.has-meal { border-color: #FDE68A; background: #FEF3C7; }
  .day-chip .t { font-weight: 700; color: #B45309; }

  .breakdown-note {
    font-size: 11.5px;
    color: var(--text-muted);
    margin-top: 12px;
    font-family: 'JetBrains Mono', monospace;
    line-height: 1.6;
  }

  /* Bazar Log */
  .bazar-list { display: flex; flex-direction: column; gap: 0; }
  
  .bazar-item {
    display: grid;
    grid-template-columns: 110px 1fr 110px;
    gap: 14px;
    align-items: center;
    padding: 14px 0;
    border-bottom: 1px dashed #E2E8F0;
  }

  .bazar-item:last-child { border-bottom: none; }
  
  .bazar-item .date {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 500;
  }

  .bazar-item .items { font-size: 14px; color: var(--navy); font-weight: 600; }
  .bazar-item .items .by { display: block; font-size: 12px; color: var(--text-dim); margin-top: 2px; font-weight: 400; }
  
  .bazar-item .cost {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 14.5px;
    text-align: right;
    color: var(--indigo);
  }

  footer {
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--text-dim);
    padding: 30px 20px 10px;
  }

  .error-banner {
    background: var(--due-bg);
    color: var(--due);
    border: 1px solid var(--due-border);
    padding: 14px 18px;
    border-radius: 8px;
    font-size: 13px;
    margin: 24px 0;
    font-family: 'JetBrains Mono', monospace;
  }

  @media (prefers-reduced-motion: reduce){ *{ transition: none !important; } }
</style>
</head>
<body>

<header class="top">
  <div class="inner">
    <div>
      <p class="brand-eyebrow"> Baharam Uncle Mess </p>
      <h1> November 2026 </h1>
    </div>
    <div class="status">
      <div><span class="dot"></span><span id="lastUpdated">loading…</span></div>
      <div id="nextRefresh">next auto-refresh in —</div>
      <button id="refreshBtn" type="button">Refresh now</button>
    </div>
  </div>
</header>

<div class="wrap">

  <div id="errorBanner" class="error-banner" style="display:none;"></div>

  <div class="stats" id="statsRow"></div>

  <section>
    <div class="section-head">
      <h2>Members</h2>
      <span class="count" id="memberCount"></span>
    </div>
    <table class="ledger">
      <thead>
        <tr>
          <th>Name</th>
          <th class="num">Meals</th>
          <th class="num">Deposit (Tk)</th>
          <th class="num">Cost (Tk)</th>
          <th class="num">Balance (Tk)</th>
        </tr>
      </thead>
      <tbody id="ledgerBody"></tbody>
    </table>
  </section>

  <section>
    <div class="section-head">
      <h2>Bazar Log</h2>
      <span class="count" id="bazarCount"></span>
    </div>
    <div class="bazar-list" id="bazarList"></div>
  </section>

</div>

<footer>
  Pulled from the group's OneDrive workbook every <span id="refreshMinutes">—</span> via GitHub Actions &middot;
  <a href="data.json" target="_blank" rel="noopener">view raw data.json</a>
</footer>

<script>
const REFRESH_MS = 3 * 60 * 1000;
let nextTick = null;
let countdownTimer = null;

function fmtTk(n){
  const sign = n < 0 ? "-" : "";
  const v = Math.abs(n).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  return sign + v;
}

function fmtRelative(iso){
  const d = new Date(iso);
  const diffMin = Math.round((Date.now() - d.getTime())/60000);
  if (diffMin < 1) return "updated just now";
  if (diffMin < 60) return `updated ${diffMin} min ago`;
  const h = Math.floor(diffMin/60);
  return `updated ${h}h ${diffMin%60}m ago`;
}

function renderStats(data){
  const el = document.getElementById('statsRow');
  const dueTotal = data.total_due < 0;
  el.innerHTML = `
    <div class="stat">
      <div class="label">Grand total meals</div>
      <div class="value">${data.grand_total_meal}</div>
      <div class="sub">this month, all members</div>
    </div>
    <div class="stat">
      <div class="label">Meal rate</div>
      <div class="value">৳${data.meal_rate.toFixed(2)}</div>
      <div class="sub">bazar cost ÷ meals</div>
    </div>
    <div class="stat">
      <div class="label">Total bazar cost</div>
      <div class="value">৳${fmtTk(data.total_bazar_cost)}</div>
      <div class="sub">${data.bazar.length} trip${data.bazar.length===1?'':'s'} logged</div>
    </div>
    <div class="stat">
      <div class="label">Total deposit</div>
      <div class="value credit">৳${fmtTk(data.total_deposit)}</div>
      <div class="sub">across all members</div>
    </div>
    <div class="stat">
      <div class="label">Mess total due</div>
      <div class="value ${dueTotal?'due':'credit'}">৳${fmtTk(Math.abs(data.total_due))}</div>
      <div class="sub">${dueTotal ? 'members owe the mess' : 'mess owes members'}</div>
    </div>
    <div class="stat">
      <div class="label">Current balance</div>
      <div class="value ${data.current_balance < 0 ? 'due' : 'credit'}">৳${fmtTk(Math.abs(data.current_balance))}</div>
      <div class="sub">mess treasury on hand</div>
    </div>
  `;
}

function dayLabel(mealsObj){
  const b = mealsObj.breakfast, l = mealsObj.lunch, d = mealsObj.dinner;
  const parts = [];
  if (b) parts.push('B');
  if (l) parts.push('L');
  if (d) parts.push('D');
  return parts.join('');
}

function renderLedger(data){
  const body = document.getElementById('ledgerBody');
  document.getElementById('memberCount').textContent = `${data.people.length} members`;
  const rows = [...data.people].sort((a,b)=> a.balance - b.balance);
  body.innerHTML = rows.map((p, idx) => {
    const due = p.balance < 0;
    const badge = due ? `<span class="badge due">DUE</span>` : `<span class="badge credit">CREDIT</span>`;
    const rowId = `detail-${idx}`;
    const days = Object.entries(p.days)
      .filter(([,v]) => v.total > 0)
      .sort((a,b) => Number(a[0]) - Number(b[0]));
    const dayChips = days.length
      ? days.map(([d,v]) => `<div class="day-chip has-meal"><span class="d">Nov ${d}</span><span class="t">${dayLabel(v)} · ${v.total}</span></div>`).join('')
      : `<span class="breakdown-note">No meals recorded yet.</span>`;
    return `
      <tr class="row-toggle" data-target="${rowId}" tabindex="0">
        <td class="name-cell" data-label="Name"><span class="row-name">${p.name}</span> ${badge}</td>
        <td class="num" data-label="Meals">${p.total_meals}</td>
        <td class="num" data-label="Deposit">৳${fmtTk(p.deposit)}</td>
        <td class="num" data-label="Cost">৳${fmtTk(p.personal_cost)}</td>
        <td class="num ${due?'due':'credit'}" data-label="Balance">${due?'-':''}৳${fmtTk(Math.abs(p.balance))}</td>
      </tr>
      <tr class="day-detail" id="${rowId}">
        <td colspan="5">
          <div class="day-grid">${dayChips}</div>
          <div class="breakdown-note">Khalar ৳${fmtTk(p.khalar)} · Gas ৳${fmtTk(p.gas)} · Electricity ৳${fmtTk(p.electricity)} · Wifi ৳${fmtTk(p.wifi)} · B = breakfast (½ meal), L = lunch, D = dinner</div>
        </td>
      </tr>
    `;
  }).join('');

  body.querySelectorAll('.row-toggle').forEach(row => {
    const toggle = () => {
      const target = document.getElementById(row.dataset.target);
      target.classList.toggle('open');
    };
    row.addEventListener('click', toggle);
    row.addEventListener('keydown', e => { if(e.key==='Enter' || e.key===' '){ e.preventDefault(); toggle(); }});
  });
}

function renderBazar(data){
  const list = document.getElementById('bazarList');
  document.getElementById('bazarCount').textContent = `${data.bazar.length} entries`;
  const items = [...data.bazar].sort((a,b)=> b.date.localeCompare(a.date));
  list.innerHTML = items.map(b => `
    <div class="bazar-item">
      <div class="date">${b.date}</div>
      <div class="items">${b.items || '—'}<span class="by">by ${b.person || 'unknown'}</span></div>
      <div class="cost">৳${fmtTk(b.cost)}</div>
    </div>
  `).join('') || `<div class="breakdown-note">No bazar trips logged yet.</div>`;
}

function showError(msg){
  const banner = document.getElementById('errorBanner');
  banner.textContent = msg;
  banner.style.display = 'block';
}
function hideError(){
  document.getElementById('errorBanner').style.display = 'none';
}

function startCountdown(){
  clearInterval(countdownTimer);
  nextTick = Date.now() + REFRESH_MS;
  countdownTimer = setInterval(() => {
    const remain = Math.max(0, nextTick - Date.now());
    const m = Math.floor(remain/60000);
    const s = Math.floor((remain%60000)/1000);
    document.getElementById('nextRefresh').textContent =
      `next auto-refresh in ${m}m ${s.toString().padStart(2,'0')}s`;
  }, 1000);
}

async function loadData(){
  try{
    const res = await fetch(`data.json?t=${Date.now()}`, {cache:'no-store'});
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    hideError();
    renderStats(data);
    renderLedger(data);
    renderBazar(data);
    document.getElementById('lastUpdated').textContent = fmtRelative(data.generated_at);
  }catch(err){
    showError(`Couldn't load data.json — ${err.message}. Showing the last data that loaded successfully.`);
  }
}

document.getElementById('refreshBtn').addEventListener('click', () => { loadData(); startCountdown(); });

const refreshMinutesLabel = document.getElementById('refreshMinutes');
if (refreshMinutesLabel) {
  const mins = REFRESH_MS / 60000;
  refreshMinutesLabel.textContent = mins === 1 ? '1 minute' : `${mins} minutes`;
}

loadData();
startCountdown();
setInterval(loadData, REFRESH_MS);
</script>

</body>
</html>
